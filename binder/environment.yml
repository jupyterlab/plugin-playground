# a mybinder.org-ready environment for demoing jupyterlab-plugin-playground
# this environment may also be used locally on Linux/MacOS/Windows, e.g.
#
#   conda env update --file binder/environment.yml
#   conda activate jupyterlab-plugin-playground-demo
#
name: jupyterlab-plugin-playground-demo

channels:
  - conda-forge

dependencies:
  # runtime dependencies
  # NOTE: with repo2docker + environment.yml, Python runtime is pinned here
  # (runtime.txt would be ignored).
  - python=3.11
  - jupyterlab=4.5.5
  - notebook=7.5.0
  # labextension build dependencies
  - nodejs=20
  - pip=24.2
  - wheel=0.44.0
  # additional packages for demos
  # - ipywidgets
  - jupyterlab-lsp=5.2.0
  - jupyter-lsp=2.3.0
  - jupyterlab-js-logs=1.2.0
  - jupyterlab-tour=4.0.1
  # use the same AI package in Binder and JupyterLite deployments
  - jupyterlite-ai=0.15.0
  - pip:
      - jupyterlab-open-url-parameter==0.4.0
