dependencies:
  - python=3.12
  - pip
  - pydata-sphinx-theme
  - myst-parser
  - ipywidgets>=8.0,<9
  - jupyterlab>=4.0.0,<5
  - jupyterlab-js-logs>=1.3.1,<2
  - jupyterlab-tour>=4,<5
  - jupyterlab-language-pack-fr-FR
  - jupyterlab-language-pack-zh-CN
  - jupyter-ai-lite>=0.21,<1
  - jupyterlite-core>=0.8.0,<0.9
  - jupyterlite-sphinx>=0.23.0,<0.24
  - jupyterlite-pyodide-kernel>=0.8.0,<0.9
  - nodejs=18
  - pip:
      - build
      - jupyterlab-open-url-parameter>=0.4,<1
